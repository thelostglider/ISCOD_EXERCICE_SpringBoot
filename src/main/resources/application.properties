spring.application.name=SpringBoot_FIA_exercice
server.port=${DATA_SERVER_PORT:8081}
server.servlet.context-path=/api/v1
# Database configuration
spring.datasource.url=jdbc:postgresql://${DB_BASE_URL:localhost:5432}/${DB_NAME:fia}
spring.datasource.username=${DB_USERNAME:tribaldistrict}
spring.datasource.password=${DB_PASSWORD:}
# Hibernate configuration
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
# Logging configuration
logging.level.org.hibernate.tool.schema=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.jdbc=DEBUG